<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BottleCaller</title>
    <script>
      (function () {
        // Always remove legacy default Supabase auth tokens.
        // You want exactly ONE authority key: bc_supabase_auth_v1
        try {
          for (let i = localStorage.length - 1; i >= 0; i--) {
            const k = localStorage.key(i);
            if (k && k.startsWith("sb-") && k.endsWith("-auth-token")) {
              console.warn("[PREBOOT] removing legacy supabase key", k);
              localStorage.removeItem(k);
            }
          }
        } catch {}
      })();
    </script>
    <script>
      (function () {
        const qs = new URLSearchParams(location.search);
        if (qs.get("traceAuth") !== "1") return;

        const KEY = "bc_supabase_auth_v1";

        console.warn("[TRACEAUTH] enabled. Purging key, then tracing writes:", KEY);

        // 1) Purge FIRST so we guarantee the next appearance is a WRITE we can catch
        try { localStorage.removeItem(KEY); } catch {}
        try { sessionStorage.removeItem(KEY); } catch {}

        // 2) Trace writes to the key (same tab / same JS context)
        try {
          const origSet = Storage.prototype.setItem;
          Storage.prototype.setItem = function (k, v) {
            if (k === KEY) {
              console.group("[TRACEAUTH] setItem → " + KEY);
              console.trace("STACK");
              try { console.log("value preview:", String(v).slice(0, 120) + "..."); } catch {}
              console.groupEnd();
            }
            return origSet.call(this, k, v);
          };

          const origRemove = Storage.prototype.removeItem;
          Storage.prototype.removeItem = function (k) {
            if (k === KEY) {
              console.group("[TRACEAUTH] removeItem → " + KEY);
              console.trace("STACK");
              console.groupEnd();
            }
            return origRemove.call(this, k);
          };
        } catch (e) {
          console.warn("[TRACEAUTH] failed to patch Storage", e);
        }

        // 3) Detect cross-tab changes (writes from other tabs won’t hit our setItem hook)
        window.addEventListener("storage", (e) => {
          if (e.key === KEY) {
            console.group("[TRACEAUTH] storage event (OTHER TAB) → " + KEY);
            console.log("old:", e.oldValue ? "non-null" : "null");
            console.log("new:", e.newValue ? "non-null" : "null");
            console.groupEnd();
          }
        });

        // 4) Poll so we can see it appear even if it’s set without calling setItem here (rare, but helps)
        let last = null;
        setInterval(() => {
          let cur = null;
          try { cur = localStorage.getItem(KEY); } catch {}
          if (cur !== last) {
            console.group("[TRACEAUTH] POLL change → " + KEY);
            console.log("was:", last ? "non-null" : "null");
            console.log("now:", cur ? "non-null" : "null");
            console.groupEnd();
            last = cur;
          }
        }, 250);
      })();
    </script>
    <script>
      (function () {
        const qs = new URLSearchParams(location.search);
        const kill = qs.get("killAuth") === "1";

        if (!kill) return;

        console.warn("[KILLAUTH] Engaged. bc_supabase_auth_v1 will be BLOCKED.");

        // 1) delete existing token
        try { localStorage.removeItem("bc_supabase_auth_v1"); } catch {}
        try { sessionStorage.removeItem("bc_supabase_auth_v1"); } catch {}

        // 2) monkeypatch localStorage.setItem to block any writes to the key
        try {
          const origSet = Storage.prototype.setItem;
          Storage.prototype.setItem = function (k, v) {
            if (k === "bc_supabase_auth_v1") {
              console.group("[KILLAUTH] blocked write to bc_supabase_auth_v1");
              console.trace("WRITE ATTEMPT STACK");
              try { console.log("value preview:", String(v).slice(0, 120) + "..."); } catch {}
              console.groupEnd();
              return;
            }
            return origSet.call(this, k, v);
          };
        } catch (e) {
          console.warn("[KILLAUTH] failed to patch setItem", e);
        }

        // 3) also block remove->readd cycles via defineProperty (best effort)
        try {
          Object.defineProperty(window, "__BC_FORCE_LOGGED_OUT__", { value: true, writable: false });
        } catch {}

        // 4) clean URL so it doesn't keep re-running
        try {
          const u = new URL(location.href);
          u.searchParams.delete("killAuth");
          history.replaceState({}, "", u.pathname + u.search);
        } catch {}
      })();
    </script>
    <script>
      (function () {
        const qs = new URLSearchParams(location.search);
        const loggedOut = qs.get("loggedOut") === "1";
        if (loggedOut) {
          try { localStorage.setItem("__BC_LOGOUT_LOCK__", String(Date.now())); } catch {}
          try { localStorage.removeItem("bc_supabase_auth_v1"); } catch {}
          try { sessionStorage.removeItem("bc_supabase_auth_v1"); } catch {}

          // legacy/default keys too
          try {
            for (let i = localStorage.length - 1; i >= 0; i--) {
              const k = localStorage.key(i);
              if (k && k.startsWith("sb-") && k.includes("auth-token")) localStorage.removeItem(k);
            }
          } catch {}

          // this flag is critical: tells parent Supabase boot to avoid persistence this tick
          window.__BC_FORCE_LOGGED_OUT__ = true;
          // clear one-shot lock so it does not become sticky across boots
          try { localStorage.removeItem("__BC_LOGOUT_LOCK__"); } catch {}
          try { sessionStorage.removeItem("__BC_LOGOUT_LOCK__"); } catch {}
          console.warn("[BOOT] forced logout latch active + logout lock cleared");
        }
      })();
    </script>
    <script>
      (() => {
        const u = new URL(window.location.href);
        if (u.searchParams.get("forceLogout") !== "1") return;

        try {
          for (let i = localStorage.length - 1; i >= 0; i--) {
            const k = localStorage.key(i);
            if (k && k.startsWith("sb-") && k.includes("auth-token")) {
              localStorage.removeItem(k);
            }
          }
        } catch {}

        try {
          for (let i = sessionStorage.length - 1; i >= 0; i--) {
            const k = sessionStorage.key(i);
            if (k && k.startsWith("sb-") && k.includes("auth-token")) {
              sessionStorage.removeItem(k);
            }
          }
        } catch {}

        try { localStorage.removeItem("__BC_FORCE_AUTH__"); } catch {}
        try { sessionStorage.removeItem("__BC_FORCE_AUTH__"); } catch {}

        u.searchParams.delete("forceLogout");
        u.searchParams.delete("mode");
        u.searchParams.delete("demo");

        history.replaceState({}, "", u.pathname);
        console.warn("[PREBOOT] Forced logout cleanup applied before app boot.");
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
