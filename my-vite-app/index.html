<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BottleCaller</title>
    <script>
      (function () {
        const qs = new URLSearchParams(location.search);
        const kill = qs.get("killAuth") === "1";

        if (!kill) return;

        console.warn("[KILLAUTH] Engaged. bc_supabase_auth_v1 will be BLOCKED.");

        // 1) delete existing token
        try { localStorage.removeItem("bc_supabase_auth_v1"); } catch {}
        try { sessionStorage.removeItem("bc_supabase_auth_v1"); } catch {}

        // 2) monkeypatch localStorage.setItem to block any writes to the key
        try {
          const origSet = Storage.prototype.setItem;
          Storage.prototype.setItem = function (k, v) {
            if (k === "bc_supabase_auth_v1") {
              console.group("[KILLAUTH] blocked write to bc_supabase_auth_v1");
              console.trace("WRITE ATTEMPT STACK");
              try { console.log("value preview:", String(v).slice(0, 120) + "..."); } catch {}
              console.groupEnd();
              return;
            }
            return origSet.call(this, k, v);
          };
        } catch (e) {
          console.warn("[KILLAUTH] failed to patch setItem", e);
        }

        // 3) also block remove->readd cycles via defineProperty (best effort)
        try {
          Object.defineProperty(window, "__BC_FORCE_LOGGED_OUT__", { value: true, writable: false });
        } catch {}

        // 4) clean URL so it doesn't keep re-running
        try {
          const u = new URL(location.href);
          u.searchParams.delete("killAuth");
          history.replaceState({}, "", u.pathname + u.search);
        } catch {}
      })();
    </script>
    <script>
      (function () {
        const qs = new URLSearchParams(location.search);
        const loggedOut = qs.get("loggedOut") === "1";
        if (loggedOut) {
          try { localStorage.setItem("__BC_LOGOUT_LOCK__", String(Date.now())); } catch {}
          try { localStorage.removeItem("bc_supabase_auth_v1"); } catch {}
          try { sessionStorage.removeItem("bc_supabase_auth_v1"); } catch {}

          // legacy/default keys too
          try {
            for (let i = localStorage.length - 1; i >= 0; i--) {
              const k = localStorage.key(i);
              if (k && k.startsWith("sb-") && k.includes("auth-token")) localStorage.removeItem(k);
            }
          } catch {}

          // this flag is critical: tells supabaseClient to NOT persist during this boot
          window.__BC_FORCE_LOGGED_OUT__ = true;
          console.warn("[BOOT] forced logout latch active + logout lock set");
        }
      })();
    </script>
    <script>
      (() => {
        const u = new URL(window.location.href);
        if (u.searchParams.get("forceLogout") !== "1") return;

        try {
          for (let i = localStorage.length - 1; i >= 0; i--) {
            const k = localStorage.key(i);
            if (k && k.startsWith("sb-") && k.includes("auth-token")) {
              localStorage.removeItem(k);
            }
          }
        } catch {}

        try {
          for (let i = sessionStorage.length - 1; i >= 0; i--) {
            const k = sessionStorage.key(i);
            if (k && k.startsWith("sb-") && k.includes("auth-token")) {
              sessionStorage.removeItem(k);
            }
          }
        } catch {}

        try { localStorage.removeItem("__BC_FORCE_AUTH__"); } catch {}
        try { sessionStorage.removeItem("__BC_FORCE_AUTH__"); } catch {}

        u.searchParams.delete("forceLogout");
        u.searchParams.delete("mode");
        u.searchParams.delete("demo");

        history.replaceState({}, "", u.pathname);
        console.warn("[PREBOOT] Forced logout cleanup applied before app boot.");
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
