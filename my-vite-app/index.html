<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BottleCaller</title>
    <script>
      (() => {
        const u = new URL(window.location.href);
        if (u.searchParams.get("forceLogout") !== "1") return;

        try {
          for (let i = localStorage.length - 1; i >= 0; i--) {
            const k = localStorage.key(i);
            if (k && k.startsWith("sb-") && k.includes("auth-token")) {
              localStorage.removeItem(k);
            }
          }
        } catch {}

        try {
          for (let i = sessionStorage.length - 1; i >= 0; i--) {
            const k = sessionStorage.key(i);
            if (k && k.startsWith("sb-") && k.includes("auth-token")) {
              sessionStorage.removeItem(k);
            }
          }
        } catch {}

        try { localStorage.removeItem("__BC_FORCE_AUTH__"); } catch {}
        try { sessionStorage.removeItem("__BC_FORCE_AUTH__"); } catch {}

        u.searchParams.delete("forceLogout");
        u.searchParams.delete("mode");
        u.searchParams.delete("demo");

        history.replaceState({}, "", u.pathname);
        console.warn("[PREBOOT] Forced logout cleanup applied before app boot.");
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
