<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>BottleCaller_Godot_Floor</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: #000;
	overflow: hidden;
	touch-action: none;
	width: 100%;
	height: 100%;
}

html {
	width: 100%;
	height: 100%;
	background: #000;
}

#canvas {
	display: block;
	width: 100% !important;
	height: 100% !important;
	touch-action: none;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
	pointer-events: none;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
	pointer-events: none;
}

#status[style*="visibility: visible"],
#status[style*="visibility:visible"] {
	pointer-events: auto;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>

<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>

		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script>
// Host helpers for BridgeController — keep Godot JavaScriptBridge.eval one-line only.
(function () {
	window.__BC_GODOT_INBOX__ = window.__BC_GODOT_INBOX__ || [];
	window.__BC_GODOT_INSTALL_INBOX__ = function () {
		if (window.__BC_GODOT_INBOX_INSTALLED__) return;
		window.__BC_GODOT_INBOX_INSTALLED__ = true;
		window.addEventListener('message', function (event) {
			var data = event && event.data;
			if (!data || data.source !== 'BC_APP') return;
			try {
				window.__BC_GODOT_INBOX__.push(JSON.stringify(data));
			} catch (err) {}
		});
	};
	window.__BC_GODOT_POST__ = function (jsonText) {
		try {
			var msg = typeof jsonText === 'string' ? JSON.parse(jsonText) : jsonText;
			if (window.parent && window.parent !== window) {
				window.parent.postMessage(msg, '*');
			}
		} catch (err) {
			console.error('[BC][GODOT] post failed', err);
		}
	};
	window.__BC_GODOT_POLL__ = function () {
		if (!window.__BC_GODOT_INBOX__ || !window.__BC_GODOT_INBOX__.length) return '';
		return window.__BC_GODOT_INBOX__.shift() || '';
	};
	window.__BC_GODOT_INSTALL_INBOX__();
})();

		<script>
const GODOT_CONFIG = {"args":["--","display/window/stretch/aspect=ignore"],"canvasResizePolicy":2,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":146289328,"index.wasm":52126319},"focusCanvas":true,"gdextensionLibs":[]};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';
	let lastProgressPct = -1;

	function postToHost(type, payload) {
		try {
			if (window.parent && window.parent !== window) {
				window.parent.postMessage({
					source: 'BC_GODOT',
					v: 1,
					type: type,
					payload: payload || {},
					at: Date.now(),
				}, '*');
			}
		} catch (err) {}
	}

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		let message = 'An unknown error occurred.';
		if (err instanceof Error) {
			message = err.message;
		} else if (typeof err === 'string') {
			message = err;
		}
		setStatusNotice(message);
		setStatusMode('notice');
		initializing = false;
		postToHost('godot_load_error', { message: message });
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
		displayFailureNotice(missingMsg + missing.join('\n'));
	} else {
		setStatusMode('progress');
		postToHost('godot_load_start', {
			pckBytes: GODOT_CONFIG.fileSizes['index.pck'] || 0,
			wasmBytes: GODOT_CONFIG.fileSizes['index.wasm'] || 0,
		});
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
					const pct = Math.min(100, Math.floor((current / total) * 100));
					if (pct !== lastProgressPct && (pct === 0 || pct === 100 || pct - lastProgressPct >= 5)) {
						lastProgressPct = pct;
						postToHost('godot_load_progress', { current: current, total: total, pct: pct });
					}
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
			postToHost('godot_load_ready', {});
			try {
				document.getElementById('canvas')?.focus?.();
			} catch (err) {}
		}, displayFailureNotice);
	}
}());
		</script>

</html>
